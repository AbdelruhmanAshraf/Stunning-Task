<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="catBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#8b24f5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181335" />
      <stop offset="100%" stop-color="#0a0718" />
    </linearGradient>
  </defs>

  <!-- Background Purple Rounded Canvas -->
  <rect width="200" height="200" rx="44" fill="url(#catBgGrad)" />

  <!-- Cat Body & Head (White) -->
  <g id="cat-character">
    <!-- Left Ear -->
    <polygon points="56,38 78,82 42,76" fill="#FFFFFF" />
    <!-- Right Ear -->
    <polygon points="144,38 158,76 122,82" fill="#FFFFFF" />

    <!-- Cat Head & Torso -->
    <path d="M 44,80 C 44,60 156,60 156,80 C 162,105 166,135 168,200 L 32,200 C 34,135 38,105 44,80 Z" fill="#FFFFFF" />

    <!-- Cool Sunglasses Frame -->
    <path d="M 36,92 C 36,82 164,82 164,92 C 164,118 135,134 105,124 C 102,123 98,123 95,124 C 65,134 36,118 36,92 Z" fill="url(#glassGrad)" stroke="#1e1838" stroke-width="3" />

    <!-- Reflections -->
    <path d="M 48,90 Q 75,88 92,98" stroke="rgba(255,255,255,0.45)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 108,98 Q 125,88 152,90" stroke="rgba(255,255,255,0.45)" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <path d="M 96,138 L 104,138 L 100,143 Z" fill="#120c24" />

    <!-- Mouth -->
    <path d="M 100,143 L 100,147 M 94,149 Q 97,146 100,147 Q 103,146 106,149" stroke="#120c24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
